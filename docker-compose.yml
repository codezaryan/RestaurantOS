version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_os_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: restaurant_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_os_backend
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/restaurant_os?schema=public"
      JWT_SECRET: "restaurant-os-enterprise-secret-key"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_os_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
