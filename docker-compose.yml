version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_os_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: restaurant_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_os_backend
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/restaurant_os?schema=public"
      JWT_SECRET: "restaurant-os-enterprise-secret-key"
      FASTAPI_URL: "http://fastapi:8000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: ./fastapi-service
      dockerfile: Dockerfile
    container_name: restaurant_os_fastapi
    environment:
      BACKEND_URL: "http://backend:5000/api"
    ports:
      - "8000:8000"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: restaurant_os_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
