# Render Blueprint for FastAPI Service
# This ensures the correct start command is used.
# Alternatively, deploy via Dockerfile option in Render dashboard.
services:
  - type: web
    name: restaurant-os-fastapi
    runtime: python
    rootDir: fastapi-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: "BACKEND_URL"
        value: "https://restaurantos-nodebackend.onrender.com/api"

